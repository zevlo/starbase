name: site

# Sync web/ to the private S3 bucket behind CloudFront and invalidate the edge.
# Assets get long immutable caching; index.html stays short so deploys show up fast.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_run:
    workflows: [terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: starbase-site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: deploy dashboard
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      BUCKET: ${{ vars.SITE_BUCKET }}
      DIST_ID: ${{ vars.CLOUDFRONT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: starbase-site-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sync hashed-safe assets (long cache)
        run: |
          aws s3 sync web/ "s3://$BUCKET/" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600, stale-while-revalidate=86400" \
            --delete

      - name: upload index.html (short cache)
        run: |
          aws s3 cp web/index.html "s3://$BUCKET/index.html" \
            --cache-control "public, max-age=60" \
            --content-type "text/html; charset=utf-8"

      - name: invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/" "/index.html" "/app.js" "/styles.css" "/mock/*" \
            --query 'Invalidation.{Id:Id,Status:Status}' --output table

      - name: smoke test
        run: |
          sleep 15
          curl -sSf -o /dev/null -w "site %{http_code}\n" https://starbase.zevlo.net/
          curl -sSf -o /dev/null -w "api  %{http_code}\n" "https://starbase.zevlo.net/api/v1/board?limit=1"
